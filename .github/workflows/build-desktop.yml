name: Build desktop releases

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            command: pnpm dist:win
            artifact: job-secretary-windows
            files: release/*.exe
          - label: macOS Universal
            os: macos-latest
            command: pnpm dist:mac
            artifact: job-secretary-macos
            files: |
              release/*.dmg
              release/*.zip

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # pnpm 11 runs only the explicitly trusted native build scripts from pnpm-workspace.yaml (allowBuilds).
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Create macOS icon
        if: runner.os == 'macOS'
        run: bash scripts/generate-macos-icon.sh

      - name: Build package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ${{ matrix.command }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Attach packages to GitHub Release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: job-secretary-*
          path: dist-release
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist-release
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Create GitHub Release when needed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="v$(node -p "require('./package.json').version")"
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" \
              --target "$GITHUB_SHA" \
              --title "求职秘书 ${release_tag}（Windows / macOS）" \
              --notes-file docs/RELEASE_NOTES_0.1.3.md \
              --prerelease
          fi

      - name: Upload Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist-release/* --clobber

