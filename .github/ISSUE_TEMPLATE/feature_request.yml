name: 功能建议
description: 提议新的求职工作流或本地功能
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      placeholder: 请描述求职过程中遇到的具体问题。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: 安全边界
      options:
        - label: 该建议不要求绕过登录、验证码、2FA、反爬限制或未经确认自动投递。
          required: true
