name: Bug 报告
description: 报告可复现的软件问题（请勿附带真实简历或 API Key）
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请先删除截图、日志和附件中的个人资料与密钥。
  - type: input
    id: version
    attributes:
      label: 求职秘书版本
      placeholder: 例如 0.1.2
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Windows 版本
      options:
        - Windows 11
        - Windows 10
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 请按顺序描述点击了什么、看到了什么。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认内容不包含真实简历、个人联系方式、账号密码或 API Key。
          required: true
